<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kejutan Ulang Tahun!</title>
    <style>
        /* CSS: Mengatur tampilan dan warna latar belakang */
        body {
            margin: 0;
            padding: 0;
            background-color: #ffe6eb; /* Warna latar belakang pink pastel */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Mengatur kotak pembungkus layar */
        .layar {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: opacity 0.8s ease-in-out;
            position: absolute;
        }

        /* Animasi Hati Mengambang */
        .hati {
            font-size: 100px;
            animation: mengambang 2s ease-in-out infinite;
            cursor: pointer;
            filter: drop-shadow(0px 10px 10px rgba(255, 0, 0, 0.2));
        }

        @keyframes mengambang {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-25px) scale(1.1); }
            100% { transform: translateY(0) scale(1); }
        }

        /* Desain Tombol "Tap Here" */
        .tombol-tap {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            background-color: #ff4d79;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 121, 0.4);
            animation: detak 1.5s infinite;
        }

        @keyframes detak {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Desain Layar Ucapan (Layar Kedua) */
        #layar-ucapan {
            opacity: 0;
            visibility: hidden;
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 80%;
            transform: scale(0.8);
            transition: all 0.8s ease;
        }

        #layar-ucapan.aktif {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        #layar-ucapan h1 {
            color: #ff4d79;
            margin-bottom: 10px;
            font-size: 32px;
        }

        #layar-ucapan p {
            color: #555;
            font-size: 18px;
            line-height: 1.6;
        }

        .kue {
            font-size: 80px;
            margin-top: 20px;
            animation: goyang 2s infinite;
        }

        @keyframes goyang {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }
    </style>
</head>
<body>

    <!-- LAYAR PERTAMA: Hati mengambang dan Tombol -->
    <div id="layar-awal" class="layar">
        <div class="hati" onclick="bukaUcapan()">❤️</div>
        <button class="tombol-tap" onclick="bukaUcapan()">Tap Here</button>
    </div>

    <!-- LAYAR KEDUA: Ucapan Ulang Tahun (Awalnya tersembunyi) -->
    <div id="layar-ucapan" class="layar">
        <h1>Selamat Ulang Tahun! 🎉</h1>
        <p>
            Semoga hari ini seindah senyummu! <br>
            Panjang umur, sehat selalu, dan semoga semua impian <br> 
            dan cita-citamu segera terwujud. Bahagia selalu ya!
        </p>
        <div class="kue">🎂</div>
    </div>

    <!-- JavaScript: Logika untuk memunculkan kejutan saat diklik -->
    <script>
        function bukaUcapan() {
            // Sembunyikan layar awal
            const layarAwal = document.getElementById('layar-awal');
            layarAwal.style.opacity = '0';
            
            setTimeout(() => {
                layarAwal.style.visibility = 'hidden';
                
                // Munculkan layar ucapan
                const layarUcapan = document.getElementById('layar-ucapan');
                layarUcapan.classList.add('aktif');
            }, 600); // Menunggu animasi memudar selama 0.6 detik
        }
    </script>

</body>
</html>
