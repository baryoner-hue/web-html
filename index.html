<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selamat Ulang Tahun</title>
    <style>
      :root {
        --bg1: #fff2d9;
        --bg2: #ffc4d6;
        --bg3: #d7f3ff;
        --pink: #ff5d8f;
        --pink-dark: #d93a6e;
        --gold: #ffd166;
        --purple: #845ec2;
        --text: #3d2c45;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
        overflow-x: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 30px 15px;
      }

      .scene {
        position: relative;
        width: min(900px, 92vw);
        min-height: 700px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        position: relative;
        width: 100%;
        background: rgba(255, 255, 255, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 32px;
        box-shadow: 0 25px 60px rgba(128, 72, 127, 0.18);
        backdrop-filter: blur(8px);
        padding: 50px 30px 40px;
        text-align: center;
        overflow: hidden;
      }

      .card::before,
      .card::after {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        filter: blur(10px);
      }

      .card::before {
        top: -100px;
        left: -70px;
      }

      .card::after {
        bottom: -90px;
        right: -50px;
      }

      .badge {
        position: relative;
        display: inline-block;
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.6);
        color: var(--pink-dark);
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-size: 0.75rem;
      }

      .cake {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 120px;
        height: 120px;
        margin: 20px auto 10px;
        border-radius: 50%;
        background: linear-gradient(145deg, #fff5da, #ffd4df);
        box-shadow: 0 15px 30px rgba(255, 120, 176, 0.2);
        font-size: 4rem;
        animation: float 2.8s ease-in-out infinite;
      }

      .title {
        position: relative;
        margin: 10px 0 12px;
        font-size: clamp(2.6rem, 7vw, 5rem);
        line-height: 1;
        font-weight: 800;
        color: var(--pink-dark);
        letter-spacing: 1px;
      }

      .title span {
        display: inline-block;
        animation: pop 1s ease infinite alternate;
      }

      .title span:nth-child(2) { animation-delay: 0.15s; }
      .title span:nth-child(3) { animation-delay: 0.3s; }
      .title span:nth-child(4) { animation-delay: 0.45s; }
      .title span:nth-child(5) { animation-delay: 0.6s; }
      .title span:nth-child(6) { animation-delay: 0.75s; }
      .title span:nth-child(7) { animation-delay: 0.9s; }
      .title span:nth-child(8) { animation-delay: 1.05s; }

      .subtitle {
        margin: 14px auto 0;
        font-size: 1.1rem;
        color: var(--text);
        max-width: 620px;
        line-height: 1.9;
      }

      .name {
        display: inline-block;
        margin: 18px 0 25px;
        padding: 12px 20px;
        border-radius: 14px;
        background: linear-gradient(135deg, #ffd166, #ff8fab);
        color: #4d1d2d;
        font-size: clamp(1.3rem, 3vw, 2.2rem);
        font-weight: 800;
        box-shadow: 0 12px 25px rgba(255, 145, 174, 0.25);
      }

      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 10px;
        padding: 15px 28px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--pink), var(--gold));
        color: var(--white);
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.5px;
        box-shadow: 0 14px 28px rgba(255, 93, 143, 0.3);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }

      .cta:hover {
        transform: translateY(-2px) scale(1.02);
        box-shadow: 0 18px 30px rgba(255, 93, 143, 0.36);
      }

      .sparkles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .sparkle {
        position: absolute;
        font-size: 1.5rem;
        animation: sparkle 2.6s ease-in-out infinite alternate;
        opacity: 0.9;
      }

      .sparkle:nth-child(1) { top: 10%; left: 8%; animation-delay: 0s; }
      .sparkle:nth-child(2) { top: 15%; right: 12%; animation-delay: 0.4s; }
      .sparkle:nth-child(3) { bottom: 18%; left: 15%; animation-delay: 0.9s; }
      .sparkle:nth-child(4) { bottom: 12%; right: 18%; animation-delay: 1.2s; }

      .confetti {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
      }

      .confetti-piece {
        position: absolute;
        top: -10%;
        width: 10px;
        height: 16px;
        border-radius: 4px;
        opacity: 0.9;
        animation: fall linear infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }

      @keyframes pop {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(-6px) scale(1.08); }
      }

      @keyframes sparkle {
        0% { transform: scale(0.8) rotate(0deg); opacity: 0.5; }
        100% { transform: scale(1.3) rotate(18deg); opacity: 1; }
      }

      @keyframes fall {
        0% {
          transform: translate3d(0, 0, 0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translate3d(var(--drift), 110vh, 0) rotate(540deg);
          opacity: 0.1;
        }
      }

      @media (max-width: 560px) {
        .card {
          padding: 40px 18px 30px;
        }

        .subtitle {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="sparkles" aria-hidden="true">
        <div class="sparkle">✨</div>
        <div class="sparkle">🎉</div>
        <div class="sparkle">✨</div>
        <div class="sparkle">🎊</div>
      </div>

      <div class="confetti" id="confetti" aria-hidden="true"></div>

      <div class="card">
        <div class="badge">Special Day</div>
        <div class="cake">🎂</div>

        <h1 class="title" aria-label="Selamat ulang tahun">
          <span>S</span><span>E</span><span>L</span><span>A</span><span>M</span><span>A</span><span>T</span>
        </h1>

        <div class="name">Happy Birthday, Kamu!</div>

        <p class="subtitle">
          Semoga hari ini dipenuhi dengan kebahagiaan, senyum, dan banyak momen indah.<br />
          Semoga kesehatan, keberkahan, dan semua impianmu terus datang di tahun yang baru ini.
        </p>

        <a href="#" class="cta">🎁 Wish You the Best</a>
      </div>
    </div>

    <script>
      const confetti = document.getElementById('confetti');
      const colors = ['#ff5d8f', '#ffd166', '#845ec2', '#4ecdc4', '#ff9f1c', '#ff6b6b'];

      for (let i = 0; i < 55; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = (Math.random() * 3).toFixed(2) + 's';
        piece.style.animationDuration = (3 + Math.random() * 3).toFixed(2) + 's';
        piece.style.setProperty('--drift', (Math.random() * 220 - 110) + 'px');
        piece.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
        confetti.appendChild(piece);
      }
    </script>
  </body>
</html>
